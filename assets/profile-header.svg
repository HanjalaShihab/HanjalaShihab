    ========================== -->

    <path d="M-80 360
         C120 300 190 405 360 345
         S620 290 790 350
         S1050 405 1220 340
         S1370 305 1480 350" stroke="url(#cyanPink)" stroke-width="2" stroke-opacity="0.16" fill="none">

      <animate attributeName="d" dur="10s" repeatCount="indefinite" values="
        M-80 360 C120 300 190 405 360 345 S620 290 790 350 S1050 405 1220 340 S1370 305 1480 350;
        M-80 345 C120 395 190 290 360 360 S620 410 790 335 S1050 290 1220 360 S1370 395 1480 340;
        M-80 360 C120 300 190 405 360 345 S620 290 790 350 S1050 405 1220 340 S1370 305 1480 350
        "></animate>

    </path>


    <path d="M-100 385
