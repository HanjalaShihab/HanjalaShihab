    <path d="M1325 30H1370V75" stroke="#BF3989" stroke-width="2" stroke-opacity="0.6"></path>


    <path d="M30 355V400H75" stroke="#0891B2" stroke-width="2" stroke-opacity="0.6"></path>


    <path d="M1325 400H1370V355" stroke="#6366F1" stroke-width="2" stroke-opacity="0.6"></path>


