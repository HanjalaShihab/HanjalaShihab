    ========================== -->

    <g opacity="0.5">

      <circle cx="190" cy="155" r="10" stroke="#0969DA" stroke-width="1">

        <animate attributeName="r" values="8;35;8" dur="4s" repeatCount="indefinite"></animate>

        <animate attributeName="opacity" values="0.6;0;0.6" dur="4s" repeatCount="indefinite"></animate>

