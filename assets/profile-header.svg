<svg width="1400" height="430" viewBox="0 0 1400 430" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- =========================
         LIGHT MILK BACKGROUND
    ========================== -->
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7F4ED"></stop>
      <stop offset="0.5" stop-color="#FAF8F2"></stop>
      <stop offset="1" stop-color="#F1F3F7"></stop>
    </linearGradient>

    <!-- Accent gradients -->
    <linearGradient id="bluePurple" x1="180" y1="0" x2="1150" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0969DA"></stop>
      <stop offset="0.5" stop-color="#6366F1"></stop>
      <stop offset="1" stop-color="#BF3989"></stop>
    </linearGradient>

    <linearGradient id="cyanPink" x1="0" y1="0" x2="1400" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0891B2"></stop>
      <stop offset="0.5" stop-color="#6366F1"></stop>
      <stop offset="1" stop-color="#DB2777"></stop>
    </linearGradient>

    <!-- Ambient glows -->
    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 80) rotate(30) scale(430 300)">
      <stop stop-color="#3B82F6" stop-opacity="0.13"></stop>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"></stop>
    </radialGradient>

    <radialGradient id="glowPink" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1270 340) rotate(-30) scale(430 300)">
      <stop stop-color="#EC4899" stop-opacity="0.11"></stop>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"></stop>
    </radialGradient>

    <!-- Soft shadows -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#64748B" flood-opacity="0.12"></feDropShadow>
    </filter>

    <!-- Glow -->
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"></feGaussianBlur>
    </filter>

    <!-- Dot pattern -->
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#64748B" fill-opacity="0.12"></circle>
    </pattern>

    <!-- Clip -->
    <clipPath id="clip">
      <rect x="0" y="0" width="1400" height="430" rx="22"></rect>
    </clipPath>

  </defs>


  <!-- =========================
       BACKGROUND
  ========================== -->

  <g clip-path="url(#clip)">

    <rect width="1400" height="430" fill="#F7F4ED"></rect>

    <rect width="1400" height="430" fill="url(#bg)"></rect>

    <!-- Ambient light -->
    <rect width="1400" height="430" fill="url(#glowBlue)"></rect>

    <rect width="1400" height="430" fill="url(#glowPink)"></rect>

    <!-- Dot grid -->
    <rect width="1400" height="430" fill="url(#dots)"></rect>


    <!-- =========================
         DECORATIVE ORBITS
    ========================== -->

    <g opacity="0.45">

      <ellipse cx="1160" cy="125" rx="190" ry="72" transform="rotate(-18 1160 125)" stroke="#6366F1" stroke-opacity="0.16"></ellipse>

      <ellipse cx="1160" cy="125" rx="145" ry="52" transform="rotate(-18 1160 125)" stroke="#0969DA" stroke-opacity="0.12"></ellipse>

      <ellipse cx="220" cy="340" rx="180" ry="65" transform="rotate(17 220 340)" stroke="#BF3989" stroke-opacity="0.12"></ellipse>

    </g>


    <!-- =========================
         FLOATING PARTICLES
    ========================== -->

    <g>

      <circle cx="102" cy="82" r="3" fill="#0969DA" opacity="0.6">

        <animate attributeName="cy" values="82;72;82" dur="4s" repeatCount="indefinite"></animate>

      </circle>


      <circle cx="1260" cy="72" r="2.5" fill="#BF3989" opacity="0.6">

        <animate attributeName="cy" values="72;84;72" dur="5s" repeatCount="indefinite"></animate>

      </circle>


      <circle cx="1320" cy="240" r="3" fill="#6366F1" opacity="0.55">

        <animate attributeName="cx" values="1320;1305;1320" dur="4.5s" repeatCount="indefinite"></animate>

      </circle>


      <circle cx="75" cy="270" r="2" fill="#0891B2" opacity="0.6">

        <animate attributeName="cx" values="75;88;75" dur="4s" repeatCount="indefinite"></animate>

      </circle>


      <circle cx="1190" cy="365" r="2.5" fill="#DB2777" opacity="0.55">

        <animate attributeName="cy" values="365;352;365" dur="4.2s" repeatCount="indefinite"></animate>

      </circle>

    </g>


    <!-- =========================
