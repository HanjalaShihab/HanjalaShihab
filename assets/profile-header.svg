         S650 325 850 375
         S1100 420 1270 370
         S1410 330 1500 370" stroke="#6366F1" stroke-width="1" stroke-opacity="0.12" fill="none">

      <animate attributeName="d" dur="12s" repeatCount="indefinite" values="
        M-100 385 C130 330 230 420 410 370 S650 325 850 375 S1100 420 1270 370 S1410 330 1500 370;
        M-100 370 C130 420 230 330 410 385 S650 420 850 360 S1100 330 1270 385 S1410 420 1500 365;
        M-100 385 C130 330 230 420 410 370 S650 325 850 375 S1100 420 1270 370 S1410 330 1500 370
