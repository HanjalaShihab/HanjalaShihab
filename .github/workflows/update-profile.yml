name: Update Profile SVG

on:
  workflow_dispatch:

  schedule:
    - cron: "17 0 * * *"

  push:
    branches:
      - main
    paths:
      - "assets/profile-header.template.svg"
      - "scripts/generate_profile_svg.py"
      - ".github/workflows/update-profile.yml"


permissions:
  contents: write


concurrency:
  group: update-profile-svg
  cancel-in-progress: true


jobs:

  generate:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ==========================================
      # PYTHON
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================
      # GENERATE SVG
      # ==========================================

      - name: Generate profile SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: HanjalaShihab
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

        run: |

          echo "======================================"
          echo "Generating GitHub Profile SVG"
          echo "======================================"

          python scripts/generate_profile_svg.py

          echo ""
          echo "Generated files:"
          ls -lah assets/


      # ==========================================
      # VERIFY
      # ==========================================

      - name: Verify generated SVG
        run: |

          if [ ! -f "assets/profile-header.svg" ]; then
            echo "ERROR: profile-header.svg was not generated."
            exit 1
          fi

          echo "profile-header.svg exists."

          echo ""
          echo "Checking for unresolved placeholders..."

          if grep -q "{{REPOS}}" assets/profile-header.svg; then
            echo "ERROR: REPOS placeholder still exists."
            exit 1
          fi

          if grep -q "{{COMMITS}}" assets/profile-header.svg; then
            echo "ERROR: COMMITS placeholder still exists."
            exit 1
          fi

          if grep -q "{{BUILD}}" assets/profile-header.svg; then
            echo "ERROR: BUILD placeholder still exists."
            exit 1
          fi

          echo "All placeholders successfully replaced."


      # ==========================================
      # COMMIT
      # ==========================================

      - name: Commit generated SVG
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/profile-header.svg

          if git diff --cached --quiet; then

            echo "No changes detected."
            exit 0

          fi

          git commit \
            -m "chore: update GitHub profile stats"

          git push
